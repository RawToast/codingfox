name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify bundle exists
        run: |
          test -f dist/index.js || (echo "dist/index.js not found" && exit 1)
          test -f dist/tiktoken_bg.wasm || (echo "dist/tiktoken_bg.wasm not found" && exit 1)

  node-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test with Node 20
        run: |
          # Run the bundle under Node 20 to ensure it works
          # It will fail quickly due to missing env vars, but that's OK
          # We just want to verify the bundle loads correctly
          timeout 5s node dist/index.js || exit_code=$?
          if [ "$exit_code" = "124" ]; then
            echo "Bundle loaded successfully (timed out as expected)"
          else
            echo "Bundle loaded and exited with code: $exit_code"
          fi
